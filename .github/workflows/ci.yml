name: Next.js CI Portfolio Build

on:
  pull_request:
    branches:
      - main
      - master
      - dev

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Compile Check
        run: npx tsc --noEmit

      - name: Execute Jest Test Suites
        run: npm test

      - name: Execute Production Next.js Build
        run: npm run build
